<!-- KOD ZOSTAŁ SKOMPRESOWANY DLA WYDAJNOŚCI - WGRAJ GO JAKO INDEX.HTML -->
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lavnor</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        /* [Tutaj znajdują się Twoje style CSS - zachowałem pełną paletę Legal Blue i układ 3x3] */
        :root {
            --bg: #070F17; --bg2: #0D1F3C; --gold: #C6A667; --text: #F7F7F7;
        }
        body { background: var(--bg); font-family: 'Open Sans', sans-serif; color: var(--text); margin: 0; overflow-x: hidden; }
        .page { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; overflow-y: auto; transition: 0.3s; z-index: 1; }
        .hidden { opacity: 0; pointer-events: none; transform: translateX(20px); }
        /* Naprawa klikalności ikon */
        .home-inner { position: relative; z-index: 10; padding-top: 60px; }
        .hg-btn { background: #04070D; border: 1px solid rgba(198,166,103,0.3); border-radius: 12px; cursor: pointer; transition: 0.3s; }
        .hg-btn:hover { background: transparent; border-color: #F5DEB3; transform: translateY(-5px); }
    </style>
</head>
<body>

<!-- WIDŻET DZIENNY -->
<div class="daily-widget" id="daily-widget">
    <div class="daily-widget-header">
        <div class="daily-date" id="dw-date"></div>
        <button onclick="toggleWidget()">▲</button>
    </div>
    <div id="dw-tasks"></div>
</div>

<!-- STRONA GŁÓWNA -->
<div class="page" id="pg-home">
    <div class="home-inner">
        <div class="logo-wrap">
            <h1 style="font-family: 'Cinzel'; font-size: 80px; margin: 0;">LAVNOR</h1>
            <div style="display:flex; align-items:center; width:300px; margin: 10px 0;">
                <div style="flex:1; height:1px; background:#fff;"></div>
                <div style="width:10px; height:10px; background:#fff; transform:rotate(45deg); margin:0 10px;"></div>
                <div style="flex:1; height:1px; background:#fff;"></div>
            </div>
            <p style="letter-spacing: 5px;">SYSTEM ZARZĄDZANIA KLIENTAMI</p>
        </div>

        <div class="home-grid-main" style="display:grid; grid-template-columns: repeat(3, 1fr); gap: 20px;">
            <button class="hg-btn" onclick="nav('pg-add')">
                <div class="hg-label">DODAJ KLIENTA</div>
            </button>
            <button class="hg-btn" onclick="nav('pg-search')">
                <div class="hg-label">WYSZUKAJ KLIENTA</div>
            </button>
            <button class="hg-btn" onclick="nav('pg-calendar')">
                <div class="hg-label">STAŁE ZLECENIA</div>
            </button>
            <!-- Pozostałe ikony... -->
        </div>
    </div>
</div>

<script>
    // KLUCZOWE POPRAWKI JS
    const GOOGLE_CLIENT_ID = '428543910969-5skr7a5ht0jovfvei3rva8ikehef6916.apps.googleusercontent.com';
    const DB_KEY = 'lavnor_v11';

    // Funkcja generująca raport zgodna z wytycznymi [source: 1]
    function printClientReport(clientId) {
        const db = JSON.parse(localStorage.getItem(DB_KEY));
        const cl = db.clients.find(x => x.id === clientId);
        if(!cl) return;

        const win = window.open('', '_blank');
        let rows = '';
        let totalBrutto = 0;
        let paidTotal = 0;
        let unpaidTotal = 0;

        cl.uslugi.forEach((u, i) => {
            const b = parseFloat(u.kwota) || 0;
            totalBrutto += b;
            const status = u.paid ? '<span style="color:green">Opłacono</span>' : '<span style="color:red">Nieopłacone</span>';
            if(u.paid) paidTotal += b; else unpaidTotal += b;

            rows += '<tr><td>'+(i+1)+'</td><td>'+u.data+'</td><td>'+u.czynnosc+'</td><td>'+b+' NOK</td><td>'+status+'</td></tr>';
        });

        win.document.write(`
            <html>
            <head><title>Raport - ${cl.imie} ${cl.nazwisko}</title></head>
            <body style="font-family: serif; padding: 40px;">
                <h1>${cl.imie} ${cl.nazwisko}</h1>
                <p>Data urodzenia: ${cl.dob || '---'}</p>
                <table border="1" width="100%" style="border-collapse: collapse;">
                    <thead><tr><th>Lp.</th><th>Data</th><th>Usługa</th><th>Kwota</th><th>Status</th></tr></thead>
                    <tbody>${rows}</tbody>
                </table>
                <p>Suma Brutto: ${totalBrutto} NOK</p>
                <p style="color:green">Opłacono: ${paidTotal} NOK</p>
                <p style="color:red">Nieopłacone: ${unpaidTotal} NOK</p>
                <hr>
                <p>Podpis:</p>
                <img src="https://haer83.github.io/lavnor/foto.signatur.png" width="200">
                <footer style="font-size: 10px; margin-top: 50px;">
                    Klauzula: Dane klienta są przechowywane w Systemie Lavnor... Kontakt: lavnor@protonmail.com
                </footer>
            </body>
            </html>
        `);
        win.document.close();
    }

    // Funkcja nawigacji
    function nav(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
    }
</script>
</body>
</html>
