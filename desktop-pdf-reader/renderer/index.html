<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self';">
<title>lexPDF</title>
<link rel="stylesheet" href="./vendor/pdfjs/web/pdf_viewer.css">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div id="app">

  <div class="toolbar">
    <div class="toolbar-group">
      <button class="tbtn" id="btn-sidebar" title="Panel boczny">&#9776;</button>
      <button class="tbtn" id="btn-open">Otworz&hellip;</button>
      <span class="sep"></span>
      <span class="filename" id="filename"></span>
    </div>

    <div class="toolbar-group toolbar-center" id="doc-controls" style="display:none">
      <button class="tbtn square" id="btn-prev" title="Poprzednia strona">&lsaquo;</button>
      <input class="pageinput" id="pageinput" type="number" min="1" value="1">
      <span class="count-sep">/</span>
      <span id="count">&ndash;</span>
      <button class="tbtn square" id="btn-next" title="Nastepna strona">&rsaquo;</button>
      <span class="sep"></span>
      <button class="tbtn square" id="btn-zoom-out" title="Pomniejsz">&minus;</button>
      <span class="zoom-label" id="zoom-label">100%</span>
      <button class="tbtn square" id="btn-zoom-in" title="Powieksz">+</button>
      <select class="tselect" id="fit-select" title="Dopasowanie widoku">
        <option value="page-width">Szerokosc strony</option>
        <option value="page-fit">Cala strona</option>
        <option value="page-actual">100%</option>
      </select>
      <span class="sep"></span>
      <select class="tselect" id="scroll-select" title="Tryb przewijania">
        <option value="0">Ciagle przewijanie</option>
        <option value="3">Pojedyncza strona</option>
      </select>
      <button class="tbtn square" id="btn-rotate" title="Obroc widok">&#10227;</button>
    </div>

    <div class="toolbar-group">
      <button class="tbtn square" id="btn-find" title="Szukaj (Ctrl+F)">&#128269;</button>
      <button class="tbtn square" id="btn-dark-doc" title="Tryb ciemny dokumentu">&#9680;</button>
      <button class="tbtn square" id="btn-print" title="Drukuj (Ctrl+P)">&#9099;</button>
    </div>
  </div>

  <div class="body-row">

    <div class="sidebar hidden" id="sidebar">
      <div class="sidebar-tabs">
        <button class="sidebar-tab active" data-tab="thumbs" title="Miniaturki">&#9638;</button>
        <button class="sidebar-tab" data-tab="outline" title="Spis tresci">&#9776;</button>
        <button class="sidebar-tab" data-tab="attachments" title="Zalaczniki">&#128206;</button>
        <button class="sidebar-tab" data-tab="search" title="Wyniki wyszukiwania">&#128269;</button>
      </div>
      <div class="sidebar-panel active" id="panel-thumbs"></div>
      <div class="sidebar-panel" id="panel-outline"></div>
      <div class="sidebar-panel" id="panel-attachments"></div>
      <div class="sidebar-panel" id="panel-search"></div>
    </div>

    <div class="viewer-wrap">
      <div id="viewerContainer" class="pdfViewerContainer">
        <div id="viewer" class="pdfViewer"></div>
      </div>

      <div class="dropzone" id="dropzone">
        <div class="dropzone-icon">&#9650;</div>
        <div class="dropzone-text"><strong>Przeciagnij plik PDF tutaj</strong><br>albo kliknij, aby wybrac plik z dysku</div>
        <div class="dropzone-hint">Dokument nigdy nie opuszcza tego komputera</div>
      </div>

      <div class="findbar hidden" id="findbar">
        <input type="text" id="find-input" placeholder="Szukaj w dokumencie...">
        <span class="find-count" id="find-count"></span>
        <button class="tbtn square small" id="find-prev" title="Poprzedni wynik">&and;</button>
        <button class="tbtn square small" id="find-next" title="Nastepny wynik">&or;</button>
        <label class="find-check"><input type="checkbox" id="find-case"> Wielkosc liter</label>
        <label class="find-check"><input type="checkbox" id="find-word"> Cale wyrazy</label>
        <button class="tbtn square small" id="find-close" title="Zamknij">&times;</button>
      </div>

      <div class="mark-toolbar hidden" id="mark-toolbar">
        <button data-type="highlight" title="Zakreslacz">&#9635;</button>
        <button data-type="underline" title="Podkreslenie">U</button>
        <button data-type="strikeout" title="Przekreslenie">S</button>
      </div>
    </div>
  </div>

  <div class="status-bar" id="status"></div>
</div>

<div class="modal-overlay hidden" id="password-modal">
  <div class="modal">
    <div class="modal-title">Dokument jest zabezpieczony haslem</div>
    <input type="password" class="modal-input" id="password-input" placeholder="Wprowadz haslo">
    <div class="modal-error" id="password-error"></div>
    <div class="modal-actions">
      <button class="mbtn mbtn-cancel" id="password-cancel">Anuluj</button>
      <button class="mbtn mbtn-ok" id="password-ok">Otworz</button>
    </div>
  </div>
</div>

<script type="module" src="./app.js"></script>
</body>
</html>
